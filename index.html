<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5233">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="تقرير الجودة">
<title>تقرير الجودة — شركة العلا</title>
<style>
:root{--g:#2F5233;--g2:#4a7c50;--bad:#d93025;--warn:#f9ab00;--bg:#f4f6f4}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:#222;font-size:16px}
header.bar{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:8px}
header.bar h1{font-size:19px;margin:0}
.stat{font-size:13px;opacity:.95;text-align:left;line-height:1.35}
main{padding:12px;max-width:900px;margin:auto;padding-bottom:110px}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.card h2{font-size:16px;margin:0 0 10px;color:var(--g)}
label{display:block;font-size:13px;color:#555;margin:8px 0 4px}
input,select{width:100%;min-height:46px;font-size:16px;padding:8px 10px;border:1.5px solid #ccc;border-radius:10px;background:#fff;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--g2);box-shadow:0 0 0 3px #4a7c5033}
.rotr{display:grid;grid-template-columns:80px 1fr auto;gap:6px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
.other{margin-top:6px}
.row{border:1.5px solid #e2e2e2;border-radius:12px;padding:10px;margin-bottom:10px;background:#fff}
.row .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.num{min-width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px}
.row .top input{flex:1;font-weight:bold;letter-spacing:1px;direction:ltr;text-align:center}
.run{font-size:12px;color:#666;min-width:70px;text-align:left}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.msg{font-size:12.5px;color:var(--bad);margin-top:4px;min-height:0}
.err{border-color:var(--bad)!important;background:#fdecea!important}
.miss{border-color:var(--warn)!important;background:#fff8e1!important}
.row.dup{border-color:var(--bad)}
button{font-family:inherit;font-size:16px;min-height:48px;border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
.btn{background:var(--g);color:#fff}.btn2{background:#e8efe8;color:var(--g)}.btn3{background:#fdecea;color:var(--bad)}
.actions{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 8px #0002;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:5}
.actions button{font-size:14px;padding:6px 4px}
table.sum{width:100%;border-collapse:collapse;font-size:15px}
table.sum th,table.sum td{border:1px solid #ddd;padding:8px;text-align:center}
table.sum th{background:var(--g);color:#fff}
.alerts div{padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:14px}
.a-bad{background:#fdecea;color:var(--bad)}.a-ok{background:#e6f4ea;color:#137333}
.hint{font-size:12.5px;color:#777}
#print{display:none}
/* ---------- PRINT ---------- */

<div class="card"><h2>بيانات اليوم</h2><div class="grid2"><div><label>التاريخ</label><input id="date" type="date"></div><div><label>مراقب الجودة</label><input id="insp"></div><div><label>الوردية</label><select id="shift"><option value=""></option><option>صباحي</option><option>مسائي</option><option>ليلي</option></select></div></div>
<div class="grid2"><div><label>حد التشوهات — أولى %</label><input id="tol1" type="number" inputmode="decimal" step="any"></div><div><label>حد التشوهات — تانية %</label><input id="tol2" type="number" inputmode="decimal" step="any"></div></div>
<div class="hint">أي حبة معفنة = الكرتونة مرفوضة (أعفان متوقعة). نسبة التشوهات = حبات التشوهات ÷ عدد الحبات (العفن مش محسوب فيها)، وبتتقارن بحد الدرجة.</div></div>
<div class="card"><h2>فحص التشغيل</h2><div id="rows"></div><datalist id="pl"></datalist><datalist id="grl"></datalist><datalist id="lnl"></datalist><button class="btn2" style="width:100%" id="addRow">+ إضافة كرتونة</button></div>
<div class="card"><h2>ملخص اليوم</h2><div id="summary"></div></div>
<div class="hint" style="text-align:center">بيتحفظ تلقائياً على الموبايل ده. يشتغل من غير إنترنت.</div>
</main>
<div class="actions"><button class="btn" id="bPrint">PDF / طباعة</button><button class="btn2" id="bXlsx">Excel</button><button class="btn2" id="bShare">مشاركة</button><button class="btn3" id="bNew">يوم جديد</button></div>
<div id="print"></div>
<script>
if(/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)||(/Safari/.test(navigator.userAgent)&&!/Chrome|Chromium|CriOS|Android/.test(navigator.userAgent)))document.documentElement.classList.add('ios');

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L={variety:["أبو سرة","صيفي","موركيت كيني","موركيت إسباني","ليمون"],size:["40","48","56","64","72","80","88","100","113","20","28","32","36","42"],carton:["مقفول 7 ك","أوبن 7 ك","كرتون 14 ك","كرتون 15 ك"],grade:["أولى","تانية"],
rot:["عفن أخضر","عفن أزرق","عفن حامضي","عفن أسود","عفن بني","عفن طرف العنق","أخرى","نتشة","عفن السرة","قطيع عالي","رمادي","أنثراكنوز","ريزوبس","ذبابة","زيت","برودة","انهيار","جروح","شقوق"],
def:["خدش / جرح","كدمات / ضغط","تشوه شكل","حرق شمس","تبقع زيتي","خدوش رياح","حشرات / قشرية","حجم مخالف","أخرى"]};
const DEFTOL={'أولى':10,'تانية':20},KEY='alola_qc_carton_v1',PKEY='alola_production_v1',VALID=/^P\d{4}$/;
const now=()=>new Date().toTimeString().slice(0,5),today=()=>new Date().toISOString().slice(0,10);
const er0=(p)=>({time:now(),v:p?.v||'',s:p?.s||'',c:p?.c||'',g:p?.g||'',gr:p?.gr||'',ln:p?.ln||'',n:'',w:'',p:'',rn:'',rt:'',rots:[{n:'',t:''},{n:'',t:''},{n:'',t:''}],dn:'',dt:'',note:'',phC:[],phR:[],phD:[]});
const er=p=>{const r=er0(p);return r};
const blank=k=>({date:today(),insp:k?.insp||'',tol:k?.tol||{...DEFTOL},rows:[er()]});
function mig(r){if(!Array.isArray(r.rots)){r.rots=[{n:r.rn??'',t:r.rt??''},{n:'',t:''},{n:'',t:''}]}while(r.rots.length<3)r.rots.push({n:'',t:''});if(r.gr==null)r.gr='';if(r.ln==null)r.ln='';syncRot(r);return r}
function syncRot(r){const a=r.rots.filter(x=>Number(x.n)>0||x.t);const tot=r.rots.reduce((t,x)=>t+(Number(x.n)||0),0);r.rn=a.length||r.rots.some(x=>x.n!=='')?String(tot):'';r.rt=a.map(x=>((Number(x.n)||'')+' '+(x.t||'')).trim()).join('، ')}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.rows){x.rows.forEach(mig);return x}}catch(e){}return blank()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('مساحة التخزين على الموبايل اتملت — امسح صور قديمة أو ابدأ يوم جديد بعد ما تبعت التقرير')}}
function prodPallets(){try{const x=JSON.parse(localStorage.getItem(PKEY));return (x&&x.rows||[]).filter(r=>VALID.test(r.p||''))}catch(e){return[]}}
const tolOf=g=>{const t=(S.tol||DEFTOL)[g];return t===''||t==null?null:Number(t)};
function res(r){const n=Number(r.n)||0,rn=Number(r.rn)||0,dn=Number(r.dn)||0;const tol=r.g?tolOf(r.g):null;
 if(rn>0)return {pct:n?Math.round(dn/n*1000)/10:'',txt:'مرفوض — أعفان متوقعة',ok:false,st:'rej',tol:tol??''};
 if(!n)return {pct:'',txt:'',ok:null,st:'',tol:tol??''};const pct=Math.round(dn/n*1000)/10;
 if(!r.g||tol==null)return {pct,txt:'ناقص — اختار الدرجة',ok:null,st:'inc',tol:''};
 return pct>tol?{pct,txt:'مخالف — تشوهات',ok:false,st:'nc',tol}:{pct,txt:'مطابق',ok:true,st:'ok',tol}}
const bTxt=R=>R.st==='rej'?R.txt:R.st==='inc'?R.txt:R.st?R.pct+'% '+R.txt+' (حد '+R.tol+'%)':'';
const bCls=R=>'badge '+(R.st==='ok'?'ok':R.st==='inc'?'inc':R.st?'bad':'');
const opts=(k,v)=>`<option value=""></option>`+L[k].map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('');
const sel=(i,f,k,lab)=>`<div><label>${lab}</label><select data-i="${i}" data-f="${f}">${opts(k,S.rows[i][f])}</select></div>`;
const inp=(i,f,lab,t='text',x='')=>`<div><label>${lab}</label><input data-i="${i}" data-f="${f}" type="${t}" ${t==='number'?'inputmode="decimal" step="any"':''} value="${esc(S.rows[i][f])}" ${x}></div>`;
const phBox=(i,f,lab)=>`<div class="phb"><label class="btn2 phbtn">+ ${lab}<input type="file" accept="image/*" multiple data-i="${i}" data-ph="${f}" style="display:none"></label><div class="phs">${S.rows[i][f].map((p,j)=>`<div class="ph1"><img src="${p}"><button class="btn3" onclick="delPh(${i},'${f}',${j})">×</button></div>`).join('')}</div></div>`;
function card(i){const r=S.rows[i],R=res(r);return `<div class="row" id="r${i}"><div class="top"><span class="num">${i+1}</span><b style="flex:1">كرتونة ${i+1}</b><span class="${bCls(R)}" id="b${i}">${bTxt(R)}</span><button class="btn3 sm" onclick="delRow(${i})">حذف</button></div>
<div class="sl">بيانات الكرتونة</div><div class="rgrid">${inp(i,'time','الوقت','time')}${sel(i,'v','variety','الصنف')}${sel(i,'s','size','المقاس')}${sel(i,'c','carton','نوع الكرتون')}${sel(i,'g','grade','الدرجة')}${inp(i,'n','عدد الحبات بالكرتونة','number')}${inp(i,'w','وزن الكرتونة (كجم)','number')}${inp(i,'p','رقم الباليت (اختياري)','text','list="pl" dir="ltr" placeholder="P0001"')}${inp(i,'gr','المزرعة / المورد','text','list="grl"')}${inp(i,'ln','الخط','text','list="lnl"')}</div>
${phBox(i,'phC','صورة الكرتونة')}
<div class="sl">مسببات الأعفان — الإجمالي: <b id="rt${i}">${Number(r.rn)||0}</b> حبة</div>${r.rots.map((x,j)=>`<div class="rotr"><input data-i="${i}" data-rot="${j}" data-k="n" type="number" inputmode="numeric" min="0" placeholder="عدد" value="${esc(x.n)}"><select data-i="${i}" data-rot="${j}" data-k="t"><option value="">نوع مسبب العفن</option>${L.rot.map(o=>`<option${o===x.t?' selected':''}>${esc(o)}</option>`).join('')}</select>${j>=3?`<button class="btn3 sm" onclick="delRot(${i},${j})">×</button>`:''}</div>`).join('')}<button class="btn2 sm" style="width:100%;margin-top:4px" onclick="addRot(${i})">+ إضافة مسبب</button>${phBox(i,'phR','صور العفن')}
<div class="sl">التشوهات الخارجية</div><div class="rgrid">${inp(i,'dn','عدد الحبات','number')}${sel(i,'dt','def','نوع التشوهات')}</div>${phBox(i,'phD','صور التشوهات')}
<div><label>ملاحظات / الإجراء</label><input data-i="${i}" data-f="note" value="${esc(r.note)}"></div></div>`}
function render(){$('rows').innerHTML=S.rows.map((_,i)=>card(i)).join('');const dl=k=>[...new Set(S.rows.map(r=>r[k]).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('');$('grl').innerHTML=dl('gr');$('lnl').innerHTML=dl('ln');$('pl').innerHTML=prodPallets().map(r=>`<option value="${esc(r.p)}">${esc([r.v,r.s,r.g].join(' '))}</option>`).join('');upd()}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='date'){S.date=t.value;save();upd();return}if(t.id==='insp'){S.insp=t.value;save();return}if(t.id==='shift'){S.shift=t.value;save();return}if(t.id==='tol1'||t.id==='tol2'){S.tol=S.tol||{...DEFTOL};S.tol[t.id==='tol1'?'أولى':'تانية']=t.value;save();render();return}
 if(t.dataset.rot!=null){const i=+t.dataset.i,r=S.rows[i];r.rots[+t.dataset.rot][t.dataset.k]=t.value;syncRot(r);save();$('rt'+i).textContent=Number(r.rn)||0;const R=res(r);const b=$('b'+i);b.className=bCls(R);b.textContent=bTxt(R);upd();return}
 if(t.dataset.f==null)return;const i=+t.dataset.i,f=t.dataset.f;let v=t.value;if(f==='p'){v=v.toUpperCase().replace(/\s/g,'');t.value=v;t.classList.toggle('err',!!v&&!VALID.test(v));const pr=prodPallets().find(x=>x.p===v);if(pr){['v','s','c','g'].forEach(k=>{if(!S.rows[i][k]&&pr[k])S.rows[i][k]=pr[k]});save();render();return}}
 S.rows[i][f]=v;save();const R=res(S.rows[i]);const b=$('b'+i);b.className=bCls(R);b.textContent=bTxt(R);upd()});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.ph)return;const i=+t.dataset.i,f=t.dataset.ph;let left=t.files.length;
 [...t.files].forEach(file=>{const im=new Image();im.onload=()=>{const m=1000,sc=Math.min(1,m/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.rows[i][f].push(cv.toDataURL('image/jpeg',0.55));URL.revokeObjectURL(im.src);if(--left===0){save();render()}};im.onerror=()=>{if(--left===0){save();render()}};im.src=URL.createObjectURL(file)});t.value=''});
window.addRot=i=>{S.rows[i].rots.push({n:'',t:''});save();render()};window.delRot=(i,j)=>{S.rows[i].rots.splice(j,1);syncRot(S.rows[i]);save();render()};
window.delPh=(i,f,j)=>{S.rows[i][f].splice(j,1);save();render()};
window.delRow=i=>{if(!confirm('تمسح كرتونة '+(i+1)+'؟'))return;S.rows.splice(i,1);if(!S.rows.length)S.rows.push(er());save();render()};
$('addRow').onclick=()=>{const l=S.rows[S.rows.length-1];S.rows.push(er(l));save();render();$('r'+(S.rows.length-1)).scrollIntoView({behavior:'smooth'})};
const used=()=>S.rows.map((r,i)=>({...r,i:i+1,R:res(r)})).filter(r=>r.n||r.v||r.rn||r.dn);
function summ(){const u=used().filter(r=>r.R.ok!==null);const inc=used().filter(r=>r.R.st==='inc').length;const a={tot:u.length,ok:u.filter(r=>r.R.ok).length,bad:u.filter(r=>!r.R.ok).length,rej:u.filter(r=>r.R.st==='rej').length,nc:u.filter(r=>r.R.st==='nc').length,inc,rot:u.filter(r=>Number(r.rn)>0).length,fr:0,rf:0,df:0,kg:0,rotT:{},defT:{},byV:{},byG:{},byL:{}};
 u.forEach(r=>{a.fr+=+r.n||0;a.rf+=+r.rn||0;a.df+=+r.dn||0;a.kg+=+r.w||0;r.rots.forEach(x=>{const n=+x.n||0;if(n||x.t){const k=x.t||'غير محدد';a.rotT[k]=(a.rotT[k]||0)+n}});if(r.dt)a.defT[r.dt]=(a.defT[r.dt]||0)+(+r.dn||0);const k=r.v||'—';a.byV[k]=a.byV[k]||{n:0,ok:0,bad:0};a.byV[k].n++;r.R.ok?a.byV[k].ok++:a.byV[k].bad++;[['byG',r.gr],['byL',r.ln]].forEach(([b,key])=>{if(!key)return;const o=a[b][key]=a[b][key]||{n:0,rej:0,nc:0,rot:{}};o.n++;if(r.R.st==='rej')o.rej++;if(r.R.st==='nc')o.nc++;r.rots.forEach(x=>{if(+x.n>0&&x.t)o.rot[x.t]=(o.rot[x.t]||0)+(+x.n)})})});
 a.pct=a.fr?Math.round(a.df/a.fr*1000)/10:0;a.okp=a.tot?Math.round(a.ok/a.tot*1000)/10:0;a.rejp=a.tot?Math.round(a.rej/a.tot*1000)/10:0;a.ncp=a.tot?Math.round(a.nc/a.tot*1000)/10:0;a.rotS=Object.entries(a.rotT).sort((x,y)=>y[1]-x[1]);a.top=a.rotS[0]?a.rotS[0][0]:'';a.avgW=a.tot?Math.round(a.kg/u.filter(r=>r.w).length*100)/100||0:0;return a}
const topOf=o=>{const e=Object.entries(o).sort((x,y)=>y[1]-x[1]);return e[0]?e[0][0].replace(/^عفن /,''):'—'};
const HKEY='alola_qc_hist_v1';const hist=()=>{try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){return[]}};
function grpT(o,lab,cls){const k=Object.keys(o);if(!k.length)return '';return `<table class="${cls}"><tr><th>${lab}</th><th>كراتين</th><th>مرفوض عفن</th><th>مخالف</th><th>% رفض</th><th>أكتر مسبب</th></tr>${k.map(x=>{const g=o[x];return `<tr><td>${esc(x)}</td><td>${g.n}</td><td>${g.rej}</td><td>${g.nc}</td><td>${Math.round((g.rej+g.nc)/g.n*1000)/10}%</td><td>${esc(topOf(g.rot))}</td></tr>`}).join('')}</table>`}
function sumHTML(a,cls){const t=o=>Object.keys(o).map(k=>`<tr><td>${esc(k)}</td><td>${o[k]}</td></tr>`).join('')||'<tr><td colspan=2>—</td></tr>';
 const mx=a.rotS.length?a.rotS[0][1]:1;
 const rotTab=`<table class="${cls}"><tr><th>مسبب العفن</th><th>حبات</th><th>%</th><th style="width:35%"></th></tr>${a.rotS.map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td><td>${a.rf?Math.round(n/a.rf*100):0}%</td><td><div class="bar" style="width:${Math.round(n/mx*100)}%"></div></td></tr>`).join('')||'<tr><td colspan=4>مفيش عفن 👍</td></tr>'}</table>`;
 const h=hist().slice(-6).concat(a.tot?[{d:S.date+' (النهارده)',tot:a.tot,rejp:a.rejp,ncp:a.ncp,okp:a.okp,top:a.top}]:[]);
 const tr=h.length>1?`<table class="${cls}"><tr><th>اليوم</th><th>كراتين</th><th>% مطابق</th><th>% رفض عفن</th><th>% مخالف</th><th>أكتر مسبب</th></tr>${h.map(x=>`<tr><td>${esc(x.d)}</td><td>${x.tot}</td><td>${x.okp}%</td><td>${x.rejp}%</td><td>${x.ncp}%</td><td>${esc((x.top||'—').replace(/^عفن /,''))}</td></tr>`).join('')}</table>`:'';
 return `<div class="kpi"><div><b>${a.tot}</b>كرتونة</div><div class="k-ok"><b>${a.okp}%</b>مطابق (${a.ok})</div><div class="k-bad"><b>${a.rejp}%</b>رفض عفن (${a.rej})</div><div class="k-w"><b>${a.ncp}%</b>مخالف تشوهات (${a.nc})</div></div>
 ${a.inc?`<div class="hint">ناقص (من غير درجة): ${a.inc}</div>`:''}
 <table class="${cls}"><tr><th>إجمالي الحبات</th><th>حبات معفنة</th><th>حبات مشوهة</th><th>نسبة التشوهات</th><th>متوسط الوزن</th><th>أكتر مسبب عفن</th></tr><tr><td>${a.fr}</td><td>${a.rf}</td><td>${a.df}</td><td>${a.pct}%</td><td>${a.avgW||'—'} كجم</td><td>${esc((a.top||'—').replace(/^عفن /,''))}</td></tr></table>
 <div class="two2">${rotTab}<table class="${cls}"><tr><th>نوع التشوه</th><th>حبات</th></tr>${t(a.defT)}</table></div>
 <table class="${cls}"><tr><th>الصنف</th><th>كراتين</th><th>مطابق</th><th>مرفوض/مخالف</th></tr>${Object.keys(a.byV).map(k=>`<tr><td>${esc(k)}</td><td>${a.byV[k].n}</td><td>${a.byV[k].ok}</td><td>${a.byV[k].bad}</td></tr>`).join('')}</table>
 ${grpT(a.byG,'المزرعة / المورد',cls)}${grpT(a.byL,'الخط',cls)}${tr?`<div class="sl">اتجاه آخر الأيام</div>${tr}`:''}`}
function upd(){const a=summ();$('summary').innerHTML=sumHTML(a,'sum');$('stat').innerHTML=`${a.tot} كرتونة · رفض ${a.rejp}%<br>${a.ok} مطابق · ${a.bad} مخالف`}
function fname(ext){return 'QC_'+(S.date||today())+'.'+ext}
const COLS=['م','التاريخ','الوقت','الصنف','المقاس','نوع الكرتون','الدرجة','عدد الحبات بالكرتونة','وزن الكرتونة (كجم)','إجمالي حبات العفن','مسببات الأعفان (عدد ونوع)','عدد حبات التشوهات','نوع التشوهات','نسبة التشوهات %','الحد المسموح %','النتيجة','ملاحظات / الإجراء','رقم الباليت','المزرعة / المورد','الخط','الوردية'];
const vals=r=>[r.i,S.date,r.time,r.v,r.s,r.c,r.g,r.n,r.w,r.rn,r.rt,r.dn,r.dt,r.R.pct===''?'':r.R.pct+'%',r.R.tol===''?'':r.R.tol+'%',r.R.txt,r.note,r.p,r.gr,r.ln,S.shift||''];
function buildPrint(){const u=used(),a=summ();const PER=22,pages=[];for(let k=0;k<Math.max(u.length,1);k+=PER)pages.push(u.slice(k,k+PER));
 const head=`<div class="ph"><div><b>التاريخ:</b> ${esc(S.date)}</div><div><b>مراقب الجودة:</b> ${esc(S.insp)}</div><div><b>حد التشوهات:</b> أولى ${tolOf('أولى')}% — تانية ${tolOf('تانية')}%</div><div><b>الوردية:</b> ${esc(S.shift||'—')} · <b>رفض عفن:</b> ${a.rejp}% · <b>مطابق:</b> ${a.okp}%</div><div><b>أي حبة معفنة = الكرتونة مرفوضة (أعفان متوقعة)</b></div><div><b>أكتر مسبب عفن:</b> ${esc((a.top||'—').replace(/^عفن /,''))}</div></div>`;
 let h=pages.map((pg,pi)=>`<div class="page"><div class="safe"><div class="ptitle">تقرير الجودة — فحص التشغيل ${pages.length>1?`<small>${pi+1}/${pages.length}</small>`:''}</div>${pi===0?head:''}
 <table class="pt" style="font-size:6.6pt"><tr>${COLS.slice(0,17).filter((_,k)=>k!==1).map(c=>`<th style="white-space:normal;line-height:1.1;height:8mm">${c.replace(' (كجم)','')}</th>`).join('')}</tr>
 ${pg.map(r=>{const v=vals(r);v.splice(1,1);return `<tr class="${r.R.ok===false?'bd':''}">${v.slice(0,16).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`}).join('')}</table></div></div>`).join('');
